<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTak MCQ</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px;background:#181818}h1{text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.timer{border:2px solid #fff;border-radius:50%;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold}.question{font-size:21px;line-height:1.4;background:#252525;padding:18px;border-radius:14px;margin:15px 0;max-height:45vh;overflow:auto}.options{display:grid;gap:10px}.option,button{padding:14px;border-radius:10px;font-size:17px;cursor:pointer}.option{background:#292929;color:white;border:1px solid #555;text-align:left}.correct{background:#176b35!important}.wrong{background:#7b2020!important}.explanation{display:none;background:#222;padding:15px;margin-top:14px;border-radius:10px;line-height:1.5}.next,.restart,.share{width:100%;margin-top:12px;border:0}.next{background:white}.restart,.share{background:#333;color:white}.score{text-align:center;margin:15px}</style></head><body>
<div class="app"><h1>⚡ TikTak MCQ</h1><audio id="bgMusic" src="background.wav" loop></audio><audio id="tickSound" src="tick.wav"></audio><audio id="finalSound" src="final_beep.wav"></audio><audio id="correctSound" src="correct.wav"></audio><audio id="wrongSound" src="wrong.wav"></audio><button class="share" onclick="toggleMusic()">🔊 Music: <span id="musicState">ON</span></button><div class="top"><span id="progress"></span><div class="timer" id="timer">20</div></div>
<div class="question" id="question"></div><div class="options" id="options"></div><div class="explanation" id="explanation"></div>
<button class="next" id="next" style="display:none" onclick="nextQ()">Next question ➜</button><div class="score" id="score">Score: 0</div><button class="restart" onclick="restart()">Restart quiz</button><button class="share" onclick="share()">Share TikTak MCQ</button></div>
<script>
const qs=[
["Which biomarker is commonly used to help detect anastomotic leakage after colorectal surgery?",["CRP","Troponin","Bilirubin","Hemoglobin"],0,"CRP is commonly used as a postoperative inflammatory marker and can help identify patients at risk of anastomotic leakage."],
["Which is a transanal option for selected low colorectal anastomotic leaks?",["Endorectal advancement flap","Splenectomy","Whipple procedure","Thyroidectomy"],0,"An endorectal advancement flap may be used for selected distal leaks."],
["TAMIS stands for:",["Transanal Minimally Invasive Surgery","Total Abdominal Medical Intestinal Surgery","Transabdominal Mesenteric Internal Stenting","Total Anal Muscle Isolation Surgery"],0,"TAMIS means Transanal Minimally Invasive Surgery."],
["TEMS is primarily a platform for:",["Transanal endoscopic surgery","Thoracic surgery","Vascular surgery","Gastric bypass"],0,"TEMS means Transanal Endoscopic Microsurgery."],
["Which intervention may be considered for selected patients with contamination from a colorectal anastomotic leak?",["Laparoscopic washout","Mastectomy","Carotid stenting","Thyroidectomy"],0,"Laparoscopic washout may be used in selected patients with intra-abdominal contamination."],
["A diverting loop ileostomy primarily aims to:",["Divert fecal stream away from a distal anastomosis","Increase gastric acid","Treat jaundice","Remove the spleen"],0,"Diversion reduces fecal flow across a distal colorectal anastomosis."],
["A chronic presacral sinus may occur after:",["A chronic anastomotic leak","Gallstones","Renal colic","Acute otitis"],0,"Persistent anastomotic leakage can produce a chronic presacral sinus."],
["Colonic motor complexes are:",["Coordinated patterns of colonic motor activity","Swallowing contractions","Respiratory movements","Permanent sphincter contractions"],0,"Colonic motor complexes are coordinated patterns of colonic motor activity that contribute to propulsion."],
["How often may major colonic motor complexes occur according to the study material?",["Once or twice per hour","Every second","Once per day only","Every 12 hours"],0,"The material describes colonic motor complexes occurring approximately once or twice per hour."],
["The internal anal sphincter is primarily:",["Circular smooth muscle","Skeletal muscle","Cardiac muscle","Bone"],0,"The internal anal sphincter is thickened circular smooth muscle."],
["The external anal sphincter is primarily:",["Skeletal muscle","Smooth muscle only","Cardiac muscle","Bone"],0,"The external anal sphincter is striated skeletal muscle and is voluntarily controlled."],
["Relaxation of the puborectalis during defecation helps to:",["Straighten the rectoanal angle","Close the anal canal","Increase the rectoanal angle","Stop rectal propulsion"],0,"Relaxation of the puborectalis straightens the anorectal angle and facilitates defecation."],
["During voluntary postponement of defecation, the external anal sphincter can:",["Contract to maintain continence","Relax completely","Paralyze the rectum","Open the anal canal"],0,"Voluntary external sphincter contraction helps postpone defecation."],
["Propulsive force during defecation is generated substantially by contractions of the:",["Rectosigmoid and rectum","Liver","Gallbladder","Diaphragm"],0,"Rectosigmoid and rectal contractions contribute to propulsion of stool."],
["Which drug can stimulate gastrointestinal motility through increased cholinergic activity?",["Neostigmine","Warfarin","Heparin","Omeprazole"],0,"Neostigmine inhibits acetylcholinesterase and increases cholinergic activity."],
["Muscarinic stimulation generally tends to:",["Promote gastrointestinal smooth-muscle activity","Stop all intestinal contractions","Cause skeletal paralysis","Reduce acetylcholine action"],0,"Muscarinic stimulation generally promotes gastrointestinal motility and secretion."],
["Which muscle helps maintain the anorectal angle?",["Puborectalis","Biceps brachii","Pectoralis major","Deltoid"],0,"The puborectalis forms a sling around the anorectal junction."],
["The purpose of an advancement flap in a selected low anastomotic leak is to:",["Cover or close the defect with tissue","Remove the liver","Create a gastric pouch","Treat gallstones"],0,"An advancement flap can provide tissue coverage over a selected distal defect."],
["If the 20-second timer expires without an answer, TikTak should:",["Reveal the correct answer and explanation","Delete the question","Award a point automatically","Restart the browser"],0,"The TikTak format reveals the answer and explanation after the response period."],
["A low postoperative inflammatory marker may be useful because it can have:",["High negative predictive value in some studied settings","100% sensitivity in every patient","No clinical relevance","A role only in liver disease"],0,"In appropriate postoperative settings, a low CRP can provide a high negative predictive value for anastomotic leak."]
];
let i=0,s=0,t=20,iv,done=false;
function render(){done=false;t=20;timer.textContent=t;progress.textContent=`Question ${i+1} / ${qs.length}`;question.textContent=qs[i][0];options.innerHTML="";explanation.style.display="none";next.style.display="none";qs[i][1].forEach((x,n)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+n)+". "+x;b.onclick=()=>answer(n);options.appendChild(b)});clearInterval(iv);iv=setInterval(()=>{timer.textContent=--t;if(t>0){let a=t<=5?finalSound:tickSound;a.currentTime=0;a.play().catch(()=>{});}if(t<=0){clearInterval(iv);answer(-1)}},1000)}
function startMusic(){bgMusic.volume=.10;bgMusic.play().catch(()=>{});}
function toggleMusic(){if(bgMusic.paused){bgMusic.play().catch(()=>{});musicState.textContent="ON"}else{bgMusic.pause();musicState.textContent="OFF"}}
document.addEventListener("click",startMusic,{once:true});
function answer(n){if(done)return;done=true;clearInterval(iv);let q=qs[i];[...options.children].forEach((b,k)=>{if(k===q[2])b.classList.add("correct");if(k===n&&n!==q[2])b.classList.add("wrong");b.disabled=true});if(n===q[2]){s++;correctSound.currentTime=0;correctSound.play().catch(()=>{})}else{wrongSound.currentTime=0;wrongSound.play().catch(()=>{})}score.textContent="Score: "+s;explanation.innerHTML="<b>"+(n===q[2]?"Correct!":"Time's up / Incorrect.")+"</b><br><br><b>Answer: "+String.fromCharCode(65+q[2])+". "+q[1][q[2]]+"</b><br><br>"+q[3];explanation.style.display="block";next.style.display="block"}
function nextQ(){i++;if(i>=qs.length){question.textContent=`Quiz complete! Final score: ${s}/${qs.length}`;options.innerHTML="";explanation.style.display="none";next.style.display="none";return}render()}
function restart(){i=0;s=0;score.textContent="Score: 0";render()}
function share(){if(navigator.share)navigator.share({title:"TikTak MCQ",text:"Try the 20-second TikTak MCQ challenge!"});else alert("Copy your website address and share it on TikTok.")}
render();
</script></body></html>
