<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTak MCQ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:16px;background:#181818}
h1{text-align:center;margin:6px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.meta{flex:1}
.timer{border:2px solid #fff;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;flex:none}
.question{font-size:21px;line-height:1.45;background:#252525;padding:18px;border-radius:14px;margin:15px 0;max-height:45vh;overflow:auto;overflow-wrap:anywhere}
.options{display:grid;gap:10px}
.option,button,select{padding:13px;border-radius:10px;font-size:16px;cursor:pointer}
.option{background:#292929;color:white;border:1px solid #555;text-align:left;width:100%;line-height:1.35;overflow-wrap:anywhere}
.option:hover{background:#333}
.option:disabled{cursor:default}
.correct{background:#176b35!important;border-color:#2d9b55!important}
.wrong{background:#7b2020!important;border-color:#b44!important}
.explanation{display:none;background:#222;padding:15px;margin-top:14px;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}
.next,.restart,.share,.category{width:100%;margin-top:12px;border:0}
.next{background:white;color:#111}
.restart,.share{background:#333;color:white}
.category{background:#292929;color:#fff;border:1px solid #555}
.score{text-align:center;margin:15px}
.small{font-size:13px;color:#bbb}
.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#333;margin-top:4px}
</style>
</head>
<body>
<div class="app">
<h1>⚡ TikTak MCQ</h1>
<audio id="bgMusic" src="background.wav" loop></audio>
<audio id="tickSound" src="tick.wav"></audio>
<audio id="finalSound" src="final_beep.wav"></audio>
<audio id="correctSound" src="correct.wav"></audio>
<audio id="wrongSound" src="wrong.wav"></audio>

<button class="share" onclick="toggleMusic()">🔊 Music: <span id="musicState">ON</span></button>
<select id="category" class="category" onchange="changeCategory()">
<option value="ALL">All MCQs</option>
<option value="Surgical Infections">Surgical Infections</option>
<option value="Hemostasis, Surgical Bleeding & Transfusion">Hemostasis, Surgical Bleeding & Transfusion</option>
</select>

<div class="top">
  <div class="meta">
    <div id="progress"></div>
    <div id="categoryLabel" class="badge"></div>
  </div>
  <div class="timer" id="timer">20</div>
</div>

<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="explanation" id="explanation"></div>

<button class="next" id="next" style="display:none" onclick="nextQ()">Next question ➜</button>
<div class="score" id="score">Score: 0</div>
<button class="restart" onclick="restart()">Restart quiz</button>
<button class="share" onclick="share()">Share TikTak MCQ</button>
</div>

<script src="questions.js"></script>
<script>
const TIMER_SECONDS=20;
let bank=[], i=0, s=0, t=TIMER_SECONDS, iv, done=false;

const timer=document.getElementById("timer");
const progress=document.getElementById("progress");
const question=document.getElementById("question");
const options=document.getElementById("options");
const explanation=document.getElementById("explanation");
const next=document.getElementById("next");
const score=document.getElementById("score");
const category=document.getElementById("category");
const categoryLabel=document.getElementById("categoryLabel");
const bgMusic=document.getElementById("bgMusic");
const tickSound=document.getElementById("tickSound");
const finalSound=document.getElementById("finalSound");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

function render(){
  if(!bank.length){ question.textContent="No questions available."; return; }
  done=false; t=TIMER_SECONDS; timer.textContent=t;
  const q=bank[i];
  progress.textContent=`Question ${i+1} / ${bank.length}`;
  categoryLabel.textContent=q.category;
  question.textContent=q.question;
  options.innerHTML="";
  explanation.style.display="none";
  next.style.display="none";
  q.options.forEach((x,n)=>{
    const b=document.createElement("button");
    b.className="option";
    b.textContent=String.fromCharCode(65+n)+". "+x;
    b.onclick=()=>answer(n);
    options.appendChild(b);
  });
  clearInterval(iv);
  iv=setInterval(()=>{
    t--;
    timer.textContent=t;
    if(t>0){
      const a=t<=5?finalSound:tickSound;
      a.currentTime=0; a.play().catch(()=>{});
    }
    if(t<=0){ clearInterval(iv); answer(-1); }
  },1000);
}

function startMusic(){ bgMusic.volume=.10; bgMusic.play().catch(()=>{}); }
function toggleMusic(){
  if(bgMusic.paused){ bgMusic.play().catch(()=>{}); musicState.textContent="ON"; }
  else { bgMusic.pause(); musicState.textContent="OFF"; }
}
document.addEventListener("click",startMusic,{once:true});

function answer(n){
  if(done)return;
  done=true; clearInterval(iv);
  const q=bank[i];
  [...options.children].forEach((b,k)=>{
    if(k===q.answer)b.classList.add("correct");
    if(k===n && n!==q.answer)b.classList.add("wrong");
    b.disabled=true;
  });
  if(n===q.answer){ s++; correctSound.currentTime=0; correctSound.play().catch(()=>{}); }
  else { wrongSound.currentTime=0; wrongSound.play().catch(()=>{}); }

  score.textContent=`Score: ${s}`;
  const result=n===q.answer ? "Correct!" : (n===-1 ? "Time's up!" : "Incorrect.");
  const exp=q.explanation ? "<br><br>"+q.explanation : "";
  explanation.innerHTML="<b>"+result+"</b><br><br><b>Answer: "+
    String.fromCharCode(65+q.answer)+". "+q.options[q.answer]+"</b>"+exp;
  explanation.style.display="block";
  next.style.display="block";
}

function nextQ(){
  i++;
  if(i>=bank.length){
    question.textContent=`Quiz complete! Final score: ${s}/${bank.length}`;
    options.innerHTML="";
    explanation.style.display="none";
    next.style.display="none";
    return;
  }
  render();
}

function restart(){ i=0; s=0; score.textContent="Score: 0"; render(); }

function changeCategory(){
  const c=category.value;
  bank=(c==="ALL") ? QUESTIONS.slice() : QUESTIONS.filter(q=>q.category===c);
  i=0; s=0; score.textContent="Score: 0"; render();
}

function share(){
  if(navigator.share)
    navigator.share({title:"TikTak MCQ",text:"Try the 20-second TikTak MCQ challenge!"});
  else
    alert("Copy your website address and share it on TikTok.");
}

changeCategory();
</script>
</body>
</html>
